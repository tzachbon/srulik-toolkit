<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">mcporter benchmark</title>
<desc id="d">Input tokens at 4 and 20 MCP calls: native 20.3k and 70.1k, mcporter 18.3k and 18.4k, saved-script 17.1k and 17.1k. Time at 20 calls: native 20.0 s, mcporter 21.8 s, saved-script 10.2 s.</desc>
<style>
.bg{fill:#fff}.tx{fill:#1f2328}.mu{fill:#59636e}.ax{stroke:#d1d9e0}
.a{fill:#9ecbff}.b{fill:#0969da}.n.a{fill:#d1d9e0}.n.b{fill:#818b98}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.tx{fill:#f0f6fc}.mu{fill:#9198a1}.ax{stroke:#3d444d}.a{fill:#1f4f8a}.b{fill:#4493f8}.n.a{fill:#3d444d}.n.b{fill:#656c76}}
</style>
<rect class="bg" width="760" height="236" rx="8"/>
<text class="tx" x="120" y="30" font-size="15" font-weight="600">Input tokens per task</text>
<text class="tx" x="540" y="30" font-size="15" font-weight="600">Time at 20 calls</text>
<rect class="a" x="120" y="44" width="12" height="12" rx="2"/><text class="mu" x="138" y="54" font-size="12">4 calls</text>
<rect class="b" x="196" y="44" width="12" height="12" rx="2"/><text class="mu" x="214" y="54" font-size="12">20 calls</text>
<line class="ax" x1="120" y1="66" x2="120" y2="214"/><line class="ax" x1="540" y1="66" x2="540" y2="214"/>
<text class="tx" x="108" y="94" font-size="13" text-anchor="end">native</text>
<rect class="n a" x="120" y="76" width="84" height="14" rx="2"/><text class="mu" x="210" y="87" font-size="11">20.3k</text>
<rect class="n b" x="120" y="93" width="290" height="14" rx="2"/><text class="tx" x="416" y="104" font-size="11" font-weight="600">70.1k</text>
<rect class="n b" x="540" y="84" width="138" height="14" rx="2"/><text class="tx" x="684" y="95" font-size="11" font-weight="600">20.0 s</text>
<text class="tx" x="108" y="142" font-size="13" text-anchor="end">mcporter</text>
<rect class="a" x="120" y="124" width="76" height="14" rx="2"/><text class="mu" x="202" y="135" font-size="11">18.3k</text>
<rect class="b" x="120" y="141" width="76" height="14" rx="2"/><text class="tx" x="202" y="152" font-size="11" font-weight="600">18.4k</text>
<rect class="b" x="540" y="132" width="150" height="14" rx="2"/><text class="tx" x="696" y="143" font-size="11" font-weight="600">21.8 s</text>
<text class="tx" x="108" y="190" font-size="13" text-anchor="end">saved-script</text>
<rect class="a" x="120" y="172" width="71" height="14" rx="2"/><text class="mu" x="197" y="183" font-size="11">17.1k</text>
<rect class="b" x="120" y="189" width="71" height="14" rx="2"/><text class="tx" x="197" y="200" font-size="11" font-weight="600">17.1k</text>
<rect class="b" x="540" y="180" width="70" height="14" rx="2"/><text class="tx" x="616" y="191" font-size="11" font-weight="600">10.2 s</text>
<text class="mu" x="120" y="230" font-size="11">Claude Code, sonnet, medians of 3 runs, all correct. Native cost grows per call; a mcporter script stays flat.</text>
