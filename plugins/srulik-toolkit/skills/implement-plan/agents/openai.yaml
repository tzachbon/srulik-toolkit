interface:
  display_name: "Implement Plan"
  short_description: "Execute an approved plan with verified integration"
  default_prompt: "Use $implement-plan to execute this approved plan within its scope and verify the integrated outcome. Repeat implementation review and fixes until the latest complete review reports zero actionable comments; optional suggestions may remain. Default to three review rounds unless the user sets another cap. Review the full change first; focus later rounds on revisions and unresolved findings while checking full context. At the cap without a clean verdict, report incomplete and ask whether to continue. Keep fixes within the agreed scope and report unresolved blockers rather than claiming completion."
