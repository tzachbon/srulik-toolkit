<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graph run</title><style>/*CSS*/</style></head><body>
<header>
  <h1 id="title">Graph run</h1>
  <div id="sum"><span class="bar"><i id="fill"></i></span><span id="counts" aria-live="polite">waiting for the run log</span><span id="clock"></span></div>
  <div class="tools">
    <button class="tool" id="layout"></button>
    <button class="tool" id="theme"></button>
    <button class="tool" id="index">Run index</button>
  </div>
</header>
<main id="main"><p id="empty">No events yet.</p></main>
<aside id="panel" aria-label="Node details"><div class="ph"><h3 id="ph" tabindex="-1"></h3><button class="close" id="close">Close</button></div><div class="pb" id="pb"></div></aside>
<script>
'use strict';
// Every value from the run log is written with textContent or as an attribute; nothing is parsed as markup.
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; };
const SVG = 'http://www.w3.org/2000/svg';
const show = v => typeof v === 'string' ? v : JSON.stringify(v);
const clip = (v, n) => v.length > n ? v.slice(0, n - 1) + '…' : v;
const dur = ms => { if (ms == null || ms < 0) return ''; const s = Math.round(ms / 1000); return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`; };

// ---- state folded from run.jsonl
// node-keyed maps have no prototype, so a node named `constructor` or `__proto__` is never already present
const map = () => Object.create(null);
const run = { spec: null, admitted: map(), inst: map(), blocked: map(), capSkipped: map(), writes: [], end: null, t0: null, last: 0 };
const key = (node, index) => node + '#' + (index ?? 0);
const inst = (node, index) => run.inst[key(node, index)] ??= { node, index: index ?? 0, id: key(node, index), state: 'waiting' };
function apply(e) {
  run.last = Math.max(run.last, e.t || 0);
  switch (e.type) {
    case 'spec': run.spec = { ...e, edges: Object.assign(map(), e.edges) }; run.t0 = e.t; break;
    case 'admit': run.admitted[e.node] = e.count; (e.items || []).forEach((it, i) => Object.assign(inst(e.node, i), { item: it.item, src: it.src })); break;
    case 'dispatch': { const i = inst(e.node, e.index); Object.assign(i, { state: 'running', attempt: e.attempt, item: e.item, src: e.src }); i.start ??= e.t; break; }
    case 'pick': Object.assign(inst(e.node, e.index), { model: e.model, effort: e.effort, provider: e.provider, reason: e.reason }); break;
    case 'result': Object.assign(inst(e.node, e.index), { state: e.dropped ? 'dropped' : 'done', stop: e.t, output: e.output, file: e.file, summary: e.summary, error: undefined,
      attachments: e.attachments || [], model: e.model ?? inst(e.node, e.index).model }); break;
    case 'gate-dropped': inst(e.node, e.index).state = 'dropped'; break;
    case 'failed': Object.assign(inst(e.node, e.index), { state: e.final ? 'failed' : 'retrying', error: e.reason, ...(e.final ? { stop: e.t } : {}) }); break;
    case 'blocked': run.blocked[e.node] = e.cause; break;
    case 'cap-skipped': run.capSkipped[e.node] = e.count; break;
    case 'write-applied': case 'write-failed': run.writes.push(e); break;
    case 'end': run.end = e; break;
  }
}

// ---- preferences: theme follows the system until the owner picks one; layout defaults to top-down
const sys = matchMedia('(prefers-color-scheme: dark)');
// storage can throw when the browser blocks it; the page then keeps the defaults
const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const theme = () => get('graph-theme') || (sys.matches ? 'dark' : 'light');
const layout = () => get('graph-layout') || 'down';
function prefs() {
  const t = theme(); document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? 'Light theme' : 'Dark theme';
  $('layout').textContent = layout() === 'down' ? 'Left to right' : 'Top down';
  schedule();
}
$('theme').onclick = () => { put('graph-theme', theme() === 'dark' ? 'light' : 'dark'); prefs(); };
$('layout').onclick = () => { put('graph-layout', layout() === 'down' ? 'right' : 'down'); prefs(); };
sys.addEventListener('change', prefs);

// ---- rendering
// A fanned-out item is often a finding object; its title or name reads better than its JSON.
const itemLabel = v => v && typeof v === 'object' && typeof (v.title ?? v.name) === 'string' ? v.title ?? v.name : show(v);
const label = i => i.item == null ? (run.admitted[i.node] > 1 ? '#' + i.index : '') : clip(itemLabel(i.item), 120);
const instancesOf = node => Object.values(run.inst).filter(i => i.node === node).sort((a, b) => a.index - b.index);
function cards(node) {
  if (node in run.blocked) return [{ node, index: 0, id: node + '#-', state: 'blocked', error: 'blocked by ' + run.blocked[node], ghost: true }];
  const list = instancesOf(node);
  if (!list.length && !run.capSkipped[node]) return [{ node, index: 0, id: node + '#-', state: node in run.admitted ? 'done' : 'waiting', ghost: true,
    summary: node in run.admitted ? 'no items' : 'waits for ' + (run.spec.edges[node] || []).join(', ') }];
  if (run.capSkipped[node]) list.push({ node, index: 'cap', id: node + '#cap', state: 'skipped', ghost: true, summary: run.capSkipped[node] + ' skipped by max_agents' });
  return list;
}
function card(i) {
  const b = el('button', 'node s-' + i.state); b.dataset.id = i.id; b.setAttribute('aria-pressed', String(open === i.id));
  const t = el('div', 't'); t.append(el('span', null, i.node), el('span', 'chip', i.state === 'retrying' ? 'retrying' : i.state)); b.append(t);
  const l = label(i); if (l) { b.append(el('div', 'l', l)); b.title = l; }
  const model = i.model ? `${i.model}${i.effort ? ' @ ' + i.effort : ''}` : '';
  if (model || i.start) {
    const m = el('div', 'd', model); b.append(m);
    // a running card's duration is updated in place by tick(), so a re-render never swallows a click
    if (i.start) { const d = el('span', 'dur', dur((i.stop ?? Date.now()) - i.start)); if (!i.stop) d.dataset.start = i.start; m.append(model ? ' · ' : '', d); }
  }
  if (i.error || i.summary) b.append(el('div', 'd', i.error || i.summary));
  if (i.attachments?.length) b.append(el('div', 'a', '📎 ' + i.attachments.join(', ')));
  b.setAttribute('aria-label', `${i.node} ${l} ${i.state}`);
  b.onclick = () => openPanel(i.id, b);
  return b;
}
let queued = false;
const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } };
function render() {
  if (!run.spec) return;
  const s = run.spec, main = $('main');
  const focused = document.activeElement?.dataset?.id;
  $('title').replaceChildren(document.createTextNode(s.name + ' '));
  const inputs = Object.entries(s.inputs || {}).map(([k, v]) => `${k}=${show(v)}`).join(' ');
  if (inputs) $('title').append(el('small', null, inputs));
  const all = Object.values(run.inst);
  const n = st => all.filter(i => i.state === st).length;
  const settled = n('done') + n('dropped') + n('failed');
  $('fill').style.width = (all.length ? settled / all.length * 100 : 0) + '%';
  const parts = [`${settled}/${all.length} done`, n('running') + n('retrying') && `${n('running') + n('retrying')} running`, n('failed') && `${n('failed')} failed`,
    n('dropped') && `${n('dropped')} dropped`, Object.keys(run.blocked).length && `${Object.keys(run.blocked).length} blocked`,
    run.end && `run ${run.end.state}`].filter(Boolean);
  $('counts').textContent = parts.join(' · ');
  tick();
  const board = el('div', 'board ' + layout());
  const svg = document.createElementNS(SVG, 'svg'); svg.classList.add('edges'); board.append(svg);
  for (const node of s.nodes) {
    const col = el('section', 'stage'); const h = el('h2'); const tag = el('span', null, node);
    tag.append(el('small', null, 'needs: ' + ((s.edges[node] || []).join(', ') || 'nothing'))); h.append(tag); col.append(h);
    cards(node).forEach(i => col.append(card(i))); board.append(col);
  }
  main.replaceChildren(board);
  if (focused) board.querySelector(`[data-id="${CSS.escape(focused)}"]`)?.focus();
  edges(board, svg);
  if (open) fillPanel(open);
}
// An instance fanned out from one source instance draws one edge from it; any other instance draws from every card of each parent.
function edges(board, svg) {
  const s = run.spec, o = board.getBoundingClientRect(), down = layout() === 'down';
  const color = st => getComputedStyle(document.documentElement).getPropertyValue({ done: '--ok', running: '--run', retrying: '--run', failed: '--bad',
    blocked: '--bad', dropped: '--skip', skipped: '--skip' }[st] || '--line').trim();
  const defs = document.createElementNS(SVG, 'defs'); svg.append(defs); const marks = {};
  const mark = c => marks[c] ??= (() => { const id = 'm' + Object.keys(marks).length; const m = document.createElementNS(SVG, 'marker');
    for (const [k, v] of Object.entries({ id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' })) m.setAttribute(k, v);
    const p = document.createElementNS(SVG, 'path'); p.setAttribute('d', 'M0,0 L10,5 L0,10 z'); p.setAttribute('fill', c); m.append(p); defs.append(m); return id; })();
  for (const node of s.nodes) for (const to of cards(node)) {
    const from = to.src ? [key(to.src.node, to.src.index)] : (s.edges[node] || []).flatMap(p => cards(p).map(c => c.id));
    for (const f of from) {
      const a = board.querySelector(`[data-id="${CSS.escape(f)}"]`), b = board.querySelector(`[data-id="${CSS.escape(to.id)}"]`); if (!a || !b) continue;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const [x1, y1, x2, y2] = down ? [ra.left + ra.width / 2 - o.left, ra.bottom - o.top, rb.left + rb.width / 2 - o.left, rb.top - o.top]
        : [ra.right - o.left, ra.top + 26 - o.top, rb.left - o.left, rb.top + 26 - o.top];
      const p = document.createElementNS(SVG, 'path');
      p.setAttribute('d', down ? `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}` : `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}`);
      const c = color(to.state); p.setAttribute('class', 'edge e-' + to.state); p.setAttribute('stroke', c); p.setAttribute('marker-end', `url(#${mark(c)})`); svg.append(p);
    }
  }
}
function tick() {
  if (!run.t0) return;
  $('clock').textContent = '· ' + dur((run.end ? run.end.t : Math.max(Date.now(), run.last)) - run.t0);
  document.querySelectorAll('.dur[data-start]').forEach(d => { d.textContent = dur(Date.now() - d.dataset.start); });
}
setInterval(() => { if (run.spec && !run.end) tick(); }, 1000);

// ---- details panel
let open = null, opener = null; // opener is a data-id or element id: re-rendering replaces the element itself
const panel = $('panel');
function openPanel(id, from) { open = id; opener = from.dataset.id ? `[data-id="${CSS.escape(from.dataset.id)}"]` : '#' + from.id; fillPanel(id); panel.classList.add('open'); $('ph').focus(); schedule(); }
function closePanel() { if (!open && !panel.classList.contains('open')) return; open = null; panel.classList.remove('open'); schedule();
  requestAnimationFrame(() => (document.querySelector(opener) || document.querySelector('[data-id]'))?.focus()); }
$('close').onclick = closePanel;
addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('open')) closePanel(); });
const getText = path => fetch(path).then(r => r.ok ? r.text() : Promise.reject(new Error(`could not load ${path}: ${r.status}`)));
let filled = null;
function fillPanel(id) {
  if (id === 'index') return;
  const i = run.inst[id] || Object.values(run.spec ? run.spec.nodes : []).flatMap(cards).find(c => c.id === id); if (!i) return;
  const sig = JSON.stringify([id, i.state, i.model, i.file, i.error, i.attachments, i.attempt]);
  if (filled === sig) return; filled = sig;
  const l = label(i); $('ph').textContent = i.ghost ? i.node : `${i.id}${l ? ' · ' + l : ''}`;
  const pb = $('pb'); pb.replaceChildren();
  const dl = el('dl'); const row = (k, v) => { if (v) dl.append(el('dt', null, k), el('dd', null, v)); };
  row('Status', i.state); row('Model', i.model && `${i.model}${i.effort ? ' @ ' + i.effort : ''}${i.provider ? ' · ' + i.provider : ''}`);
  row('Duration', i.start && dur((i.stop ?? Date.now()) - i.start)); row('Attempt', i.attempt > 1 && String(i.attempt));
  row('Why this model', i.reason && Object.entries(i.reason).filter(([, v]) => v != null && typeof v !== 'object').map(([k, v]) => `${k}: ${typeof v === 'number' ? +v.toFixed(2) : v}`).join(' · '));
  row('Inputs from', i.src ? key(i.src.node, i.src.index) : (run.spec.edges[i.node] || []).join(', '));
  row('Item', i.item != null && typeof i.item === 'object' ? JSON.stringify(i.item) : null);
  row('Summary', i.summary); pb.append(dl);
  if (i.error) pb.append(el('div', 'err', i.error));
  if (i.file) {
    pb.append(el('h4', null, 'Output file · other agents read this path'));
    const f = el('div', 'file'); const cp = el('button', null, 'Copy path');
    cp.onclick = () => navigator.clipboard?.writeText(i.file).then(() => { cp.textContent = 'Copied'; }, () => { cp.textContent = 'Copy failed'; });
    f.append(el('code', null, i.file), cp); pb.append(f);
  }
  if (i.attachments?.length) {
    pb.append(el('h4', null, 'Attachments'));
    for (const name of i.attachments) {
      const d = el('details'); const body = el('pre', null, 'Loading…'); d.append(el('summary', null, '📎 ' + name), body);
      d.addEventListener('toggle', () => { if (d.open && !d.dataset.loaded) { d.dataset.loaded = '1';
        getText(`nodes/${i.node}-${i.index}/${encodeURIComponent(name)}`).then(t => { body.textContent = t; }, e => { body.textContent = e.message; }); } });
      pb.append(d);
    }
  }
  if (i.output !== undefined) { pb.append(el('h4', null, 'Output')); pb.append(el('pre', null, typeof (i.output.text ?? i.output.body) === 'string' ? (i.output.text ?? i.output.body) : JSON.stringify(i.output, null, 2))); }
  else if (!i.error) pb.append(el('p', null, i.state === 'running' ? 'Still running. The output appears here when it finishes.' : 'No output yet.'));
}
$('index').onclick = e => {
  open = 'index'; opener = '#index'; filled = null; $('ph').textContent = 'Run index';
  const pre = el('pre', null, 'Loading…'); $('pb').replaceChildren(el('p', null, 'Every agent task gets this file, so a subagent can see what the others did.'), pre);
  getText('nodes/index.md').then(t => { pre.textContent = t; }, err => { pre.textContent = err.message; });
  panel.classList.add('open'); $('ph').focus();
};

addEventListener('resize', schedule);
prefs();
new EventSource('events').onmessage = m => { apply(JSON.parse(m.data)); schedule(); };
</script></body></html>
